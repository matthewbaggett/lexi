name: Release

# Runs on GitHub Actions only, on the public mirror. A semantic version tag such as v0.1.0
# builds 4 static binaries, makes a GitHub release with checksums, and pushes the image.
# The Forgejo CI in .forgejo/workflows is separate and does not publish anything.
#
# Settings, all optional. The defaults publish to ghcr.io with the built-in token.
#   vars.REGISTRY              registry host. Default ghcr.io
#   vars.IMAGE_NAME            image path on the registry. Default: the repo, in lower case
#   secrets.REGISTRY_USERNAME  registry user. Default: the actor that pushed the tag
#   secrets.REGISTRY_TOKEN     registry token. Default: the built-in GITHUB_TOKEN
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Check the tag and run the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The tag is a semantic version on main
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "'$GITHUB_REF_NAME' is not a semantic version tag such as v0.1.0" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "tag $GITHUB_REF_NAME is not on main" >&2; exit 1; }
      - name: Test
        run: go test ./...

  binaries:
    name: Binaries and GitHub release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build 4 static binaries and the checksums
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist/release
      - name: Check the version of the linux amd64 binary
        run: |
          want="lexi ${GITHUB_REF_NAME#v} (alex 11.0.1 compatible)"
          got="$(dist/release/lexi-linux-amd64 --version)"
          test "$got" = "$want" || { echo "got '$got', want '$want'" >&2; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--verify-tag --generate-notes)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --title "$GITHUB_REF_NAME" dist/release/lexi-* dist/release/checksums.txt

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Name the version and the tags
        id: meta
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          image="${image,,}"
          version="${GITHUB_REF_NAME#v}"
          tags="${image}:${version}"
          case "$version" in *-*) ;; *) tags="${tags},${image}:latest" ;; esac
          {
            echo "version=${version}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push the scratch image for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
